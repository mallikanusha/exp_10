name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check index.html
        run: test -f index.html

      - name: Security Check
        run: |
          grep -nE "password|secret|api_key" index.html || true

      - name: Run tests
        run: echo "Tests passed!"

      - name: Build
        run: echo "Build successful!"
